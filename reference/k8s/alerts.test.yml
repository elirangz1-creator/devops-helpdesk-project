rule_files:
- alerts.yml
evaluation_interval: 15s
tests:
- interval: 15s
  input_series:
  - series: up{job="helpdesk",instance="api:8000",environment="development"}
    values: 1 0x8 1x12
  - series: helpdesk_database_up{job="helpdesk",instance="api:8000",environment="development"}
    values: 1 0x8 1x12
  alert_rule_test:
  - eval_time: 2m
    alertname: HelpdeskDatabaseUnavailable
    exp_alerts:
    - exp_labels:
        job: helpdesk
        instance: api:8000
        environment: development
        severity: critical
      exp_annotations:
        summary: Helpdesk cannot access its database or tickets table
        description: Check PostgreSQL, credentials, schema and network connectivity.
  - eval_time: 3m
    alertname: HelpdeskDatabaseUnavailable
    exp_alerts: []
