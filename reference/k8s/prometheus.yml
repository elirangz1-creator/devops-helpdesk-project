global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
- /etc/prometheus/alerts.yml
scrape_configs:
- job_name: helpdesk
  scrape_timeout: 10s
  kubernetes_sd_configs:
  - role: pod
    namespaces:
      names:
      - helpdesk
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_pod_label_app
    action: keep
    regex: api
  - source_labels:
    - __meta_kubernetes_pod_container_port_name
    action: keep
    regex: http
  - source_labels:
    - __meta_kubernetes_pod_phase
    action: keep
    regex: Running
  - source_labels:
    - __meta_kubernetes_namespace
    target_label: namespace
  - source_labels:
    - __meta_kubernetes_namespace
    target_label: environment
  - source_labels:
    - __meta_kubernetes_pod_name
    target_label: pod
