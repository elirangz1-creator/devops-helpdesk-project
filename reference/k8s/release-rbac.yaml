apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-release
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-release
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  resourceNames:
  - api
  verbs:
  - get
  - watch
  - patch
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - ''
  resources:
  - pods/exec
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-release
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-release
subjects:
- kind: ServiceAccount
  name: jenkins-release
